name: Daily forecast

on:
  schedule:
    - cron: "17 3 * * *"   # ~05:17 Paris time (03:17 UTC in summer time)
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:            # re-run the forecast once a new calibration has been committed
    workflows: [Calibrate]
    types: [completed]

permissions:
  contents: write   # to save the rolling weather archive branch
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore static habitat layers
        uses: actions/cache@v4
        with:
          path: cache/static
          # each layer group carries its own version, so always restore the newest cache
          key: static-v2-${{ github.run_id }}
          restore-keys: |
            static-v2-
            static-v1-

      - name: Restore weather archive
        run: |
          mkdir -p archive
          if git fetch --depth=1 origin weather-archive 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C archive
          fi
          ls -la archive

      - name: Build forecast
        env:
          SPOTS_JSON: ${{ secrets.SPOTS_JSON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CDSE_S3_KEY: ${{ secrets.CDSE_S3_KEY }}
          CDSE_S3_SECRET: ${{ secrets.CDSE_S3_SECRET }}
          WEATHER_ARCHIVE: archive
        run: python -m pipeline.run --out build/site --cache cache/static

      - name: Save weather archive
        if: success()
        run: |
          cd archive
          [ -n "$(ls -A)" ] || exit 0
          # keep the latest build log + per-region summaries alongside, for easy checking
          cp ../build/site/data/status.json . 2>/dev/null || true
          for d in ../build/site/data/*/; do r=$(basename "$d"); cp "$d/meta.json" "meta-$r.json" 2>/dev/null || true; done
          git init -q -b weather-archive
          git add -A
          git -c user.name="forecast-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Weather archive $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" weather-archive

      - name: Upload site
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
