name: Calibrate

# Learns habitat weights, timing and season from public records (see pipeline/calibrate.py).
# Runs monthly, on demand, and when the calibration code changes. Results are committed to
# calibration/ and picked up by the next daily forecast.
on:
  schedule:
    - cron: "41 1 2 * *"     # 2nd of each month
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/calibrate.py", "pipeline/features.py", ".github/workflows/calibrate.yml"]

permissions:
  contents: write

concurrency:
  group: calibrate
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt scikit-learn

      - name: Restore static habitat layers
        uses: actions/cache/restore@v4
        with:
          path: cache/static
          key: static-v2-none
          restore-keys: |
            static-v2-

      - name: Restore weather history cache
        uses: actions/cache@v4
        with:
          path: history
          key: history-${{ github.run_id }}
          restore-keys: |
            history-

      - name: Calibrate
        env:
          CDSE_S3_KEY: ${{ secrets.CDSE_S3_KEY }}
          CDSE_S3_SECRET: ${{ secrets.CDSE_S3_SECRET }}
        run: python -m pipeline.calibrate --cache cache/static --out calibration --history history

      - name: Commit calibration
        if: success()
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calibration
          git commit -qm "Calibration $(date -u +%F)" || exit 0
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Publish calibration log (for checking)
        if: always()
        run: |
          mkdir -p /tmp/clog && cp -r calibration/. /tmp/clog/ 2>/dev/null || true
          cd /tmp/clog
          [ -n "$(ls -A)" ] || exit 0
          git init -q -b calibration-log
          git add -A
          git -c user.name="forecast-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Calibration log $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" calibration-log
