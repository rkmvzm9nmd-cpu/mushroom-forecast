# Each region is modelled on its own Web-Mercator pixel grid.
# To add a region (e.g. Romania), copy a block, change id/name/bbox/timezone,
# and set country (FR enables the French-only layers: IGN tree species, farm
# parcels and the French soil pH map; elsewhere Europe-wide data is used, including
# the ForestPaths 10 m tree-genus map). The Copernicus ploughing indicator is used
# everywhere when CDSE_S3_KEY / CDSE_S3_SECRET secrets are set. GB-SCT enables the
# Scottish layers (woodland types incl. birch / native pinewood, habitat map, soil pH).
regions:
  - id: massif-central-alps
    name: "Lozère to Isère"
    bbox: [3.3, 44.3, 6.1, 45.6]      # west, south, east, north (degrees)
    zoom: 10                          # ~108 m pixels at this latitude
    timezone: Europe/Paris
    country: FR                       # enables French layers (BD Foret, RPG, French soil pH)
    weather_spacing: 0.1              # degrees between weather sample points
    places:
      - {name: "Chastanier", lat: 44.726, lon: 3.755}
      - {name: "Saint-Agrève", lat: 45.010, lon: 4.400}
      - {name: "Pilat (Le Bessat)", lat: 45.360, lon: 4.530}
      - {name: "Matheysine (La Mure)", lat: 44.950, lon: 5.800}

  - id: brasov-fagaras
    name: "Brașov & Făgăraș"
    bbox: [24.4, 45.3, 26.0, 46.1]
    zoom: 10
    timezone: Europe/Bucharest
    country: RO                       # Europe-wide layers incl. 10 m tree-genus map
    weather_spacing: 0.1
    places:
      - {name: "Brașov", lat: 45.6427, lon: 25.5887}
      - {name: "Viștea / Viștișoara", lat: 45.8208, lon: 24.7706}
      - {name: "Poiana Brașov", lat: 45.5940, lon: 25.5520}
      - {name: "Zărnești", lat: 45.5640, lon: 25.3180}

  - id: scotland-south
    name: "Scotland: Borders & Southern Uplands"
    bbox: [-5.0, 54.9, -2.0, 56.1]
    zoom: 10
    timezone: Europe/London
    country: GB-SCT                   # Scottish Forestry woodland types, NatureScot habitats, Hutton soil pH
    weather_spacing: 0.15
    places:
      - {name: "Edinburgh", lat: 55.953, lon: -3.189}
      - {name: "Peebles", lat: 55.651, lon: -3.188}
      - {name: "Moffat", lat: 55.333, lon: -3.442}
      - {name: "Glentrool", lat: 55.087, lon: -4.487}

  - id: scotland-highland
    name: "Scotland: Perthshire & Cairngorms"
    bbox: [-5.0, 56.1, -2.4, 57.4]
    zoom: 10
    timezone: Europe/London
    country: GB-SCT
    weather_spacing: 0.15
    places:
      - {name: "Pitlochry", lat: 56.703, lon: -3.734}
      - {name: "Aberfeldy", lat: 56.620, lon: -3.866}
      - {name: "Aviemore", lat: 57.195, lon: -3.826}
      - {name: "Braemar", lat: 57.006, lon: -3.397}
